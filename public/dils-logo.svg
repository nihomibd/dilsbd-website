<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Top arc for "DHAKA INTERNATIONAL" -->
    <path id="top-arc" d="M 85,250 A 165,165 0 1,1 415,250" fill="none" />
    <!-- Bottom arc for "Language School" -->
    <path id="bottom-arc" d="M 95,250 A 155,155 0 0,0 405,250" fill="none" />
    
    <!-- Star definition -->
    <g id="star-gold">
      <polygon points="0,-12 3.5,-3.5 11.5,-3.5 5,2 7.5,10 0,5.5 -7.5,10 -5,2 -11.5,-3.5 -3.5,-3.5" fill="#FBB040" />
    </g>
    <g id="star-red">
      <polygon points="0,-10 3,-3 10,-3 4.5,1.5 6.5,8.5 0,4.5 -6.5,8.5 -4.5,1.5 -10,-3 -3,-3" fill="#D32F2F" />
    </g>
  </defs>

  <!-- Outer Circle Background -->
  <circle cx="250" cy="250" r="242" fill="#FFFFFF" />

  <!-- Outer Red Ring Border -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="#D32F2F" stroke-width="14" />

  <!-- Concentric Golden Yellow Band -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="#FBB040" stroke-width="26" />

  <!-- Inner Red Defining Ring -->
  <circle cx="250" cy="250" r="200" fill="none" stroke="#D32F2F" stroke-width="3" />

  <!-- White Inner Field -->
  <circle cx="250" cy="250" r="198" fill="#FFFFFF" />

  <!-- TOP TEXT: "DHAKA" & "INTERNATIONAL" -->
  <text font-family="'Times New Roman', Times, serif" font-weight="900" font-size="28" fill="#1E293B" letter-spacing="3">
    <textPath href="#top-arc" startOffset="50%" text-anchor="middle">
      DHAKA INTERNATIONAL
    </textPath>
  </text>

  <!-- CENTER SYMBOL: The DILS Educational Cap & Torii-Kanji Symbol -->
  <!-- 3 Stars above cap -->
  <use href="#star-gold" x="250" y="218" />
  <use href="#star-red" x="195" y="232" />
  <use href="#star-red" x="305" y="232" />

  <!-- Stylized Red Mortarboard Cap Outline -->
  <path d="M 250,185 L 395,242 L 250,285 L 105,242 Z" 
        fill="none" stroke="#D32F2F" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Cap Lower Peak Accent -->
  <path d="M 175,264 L 250,305 L 325,264" 
        fill="none" stroke="#D32F2F" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Central Red Structural Stem -->
  <path d="M 250,240 L 250,330" 
        fill="none" stroke="#D32F2F" stroke-width="14" stroke-linecap="round" />

  <!-- Left Wing Bracket -->
  <path d="M 180,270 L 180,315 L 250,325" 
        fill="none" stroke="#D32F2F" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" />
        
  <!-- Right Wing Bracket -->
  <path d="M 320,270 L 320,315 L 250,325" 
        fill="none" stroke="#D32F2F" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Lower Curved Feet (Torii-style base) -->
  <path d="M 225,325 Q 200,345 185,355" 
        fill="none" stroke="#D32F2F" stroke-width="12" stroke-linecap="round" />
  <path d="M 275,325 Q 300,345 315,355" 
        fill="none" stroke="#D32F2F" stroke-width="12" stroke-linecap="round" />

  <!-- White Label Plate on Left for Japanese Hiragana 'あ' -->
  <rect x="188" y="280" width="46" height="38" rx="4" fill="#FFFFFF" stroke="#D32F2F" stroke-width="2" />
  <text x="211" y="308" font-family="'Hiragino Kaku Gothic Pro', 'Meiryo', 'MS Gothic', 'Noto Sans JP', sans-serif" 
        font-size="26" font-weight="900" fill="#0288D1" text-anchor="middle">
    あ
  </text>

  <!-- White Label Plate on Right for Bengali 'আ' -->
  <rect x="266" y="280" width="46" height="38" rx="4" fill="#FFFFFF" stroke="#D32F2F" stroke-width="2" />
  <text x="289" y="309" font-family="'Noto Sans Bengali', 'SolaimanLipi', 'Bangla', sans-serif" 
        font-size="26" font-weight="900" fill="#0D47A1" text-anchor="middle">
    আ
  </text>

  <!-- BOTTOM TEXT: "Language School" -->
  <text font-family="'Times New Roman', Times, serif" font-style="italic" font-weight="bold" font-size="34" fill="#1E293B">
    <textPath href="#bottom-arc" startOffset="50%" text-anchor="middle">
      Language School
    </textPath>
  </text>
</svg>
