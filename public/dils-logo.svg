<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Top arc 1 for "DHAKA" -->
    <path id="arc-dhaka" d="M 115,250 A 135,135 0 0,1 385,250" fill="none" />
    
    <!-- Top arc 2 for "INTERNATIONAL" -->
    <path id="arc-international" d="M 85,250 A 165,165 0 0,1 415,250" fill="none" />

    <!-- Bottom arc for "Language School" -->
    <path id="arc-school" d="M 85,250 A 165,165 0 0,0 415,250" fill="none" />

    <!-- 5-Point Star Template -->
    <g id="star-gold">
      <polygon points="0,-12 3.5,-3.5 12,-3.5 5,2 7.5,10.5 0,6 -7.5,10.5 -5,2 -12,-3.5 -3.5,-3.5" fill="#FFB800" />
    </g>
    <g id="star-red">
      <polygon points="0,-11 3,-3 11,-3 4.5,1.5 7,9.5 0,5.5 -7,9.5 -4.5,1.5 -11,-3 -3,-3" fill="#E52421" />
    </g>
  </defs>

  <!-- Pure White Base Background -->
  <circle cx="250" cy="250" r="246" fill="#FFFFFF" />

  <!-- Outer Red Ring Border -->
  <circle cx="250" cy="250" r="238" fill="none" stroke="#E52421" stroke-width="16" />

  <!-- Concentric Golden Yellow Band -->
  <circle cx="250" cy="250" r="214" fill="none" stroke="#FFB800" stroke-width="26" />

  <!-- Inner Red Defining Border -->
  <circle cx="250" cy="250" r="198" fill="none" stroke="#E52421" stroke-width="3" />

  <!-- White Central Canvas -->
  <circle cx="250" cy="250" r="196" fill="#FFFFFF" />

  <!-- ==================== TOP TEXT ==================== -->
  <!-- "DHAKA" on top line in bold serif uppercase -->
  <text font-family="'Times New Roman', Georgia, serif" font-weight="900" font-size="44" fill="#18181B" letter-spacing="4">
    <text x="250" y="118" text-anchor="middle">DHAKA</text>
  </text>

  <!-- "INTERNATIONAL" on second line in bold serif uppercase -->
  <text font-family="'Times New Roman', Georgia, serif" font-weight="900" font-size="28" fill="#18181B" letter-spacing="3.5">
    <text x="250" y="156" text-anchor="middle">INTERNATIONAL</text>
  </text>

  <!-- ==================== CENTER EMBLEM ==================== -->
  <!-- 3 Stars above mortarboard cap -->
  <!-- Central Gold Star -->
  <use href="#star-gold" x="250" y="215" />
  <!-- Left Red Star -->
  <use href="#star-red" x="188" y="234" />
  <!-- Right Red Star -->
  <use href="#star-red" x="312" y="234" />

  <!-- Red Graduation Mortarboard Outline -->
  <!-- Top Roof Outline -->
  <polygon points="250,180 415,240 250,285 85,240" 
           fill="none" stroke="#E52421" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Stylized Kanji / Torii Red Structural Base Under Cap -->
  <!-- Central Post -->
  <line x1="250" y1="235" x2="250" y2="335" stroke="#E52421" stroke-width="14" stroke-linecap="round" />

  <!-- Left Inner Frame Wing -->
  <path d="M 175,275 L 175,320 L 250,330" 
        fill="none" stroke="#E52421" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Right Inner Frame Wing -->
  <path d="M 325,275 L 325,320 L 250,330" 
        fill="none" stroke="#E52421" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Lower Curved Feet (Torii-style sweeping legs) -->
  <path d="M 220,330 Q 190,355 170,366" 
        fill="none" stroke="#E52421" stroke-width="14" stroke-linecap="round" />
  <path d="M 280,330 Q 310,355 330,366" 
        fill="none" stroke="#E52421" stroke-width="14" stroke-linecap="round" />

  <!-- Left Character: Japanese Hiragana 'あ' in Light Cyan/Sky Blue -->
  <text x="208" y="306" 
        font-family="'Hiragino Kaku Gothic Pro', 'Meiryo', 'MS Gothic', 'Noto Sans JP', sans-serif" 
        font-size="34" font-weight="900" fill="#00A3E0" text-anchor="middle">
    あ
  </text>

  <!-- Right Character: Bengali 'আ' in Deep Royal/Navy Blue -->
  <text x="292" y="307" 
        font-family="'Noto Sans Bengali', 'SolaimanLipi', 'Bangla', sans-serif" 
        font-size="34" font-weight="900" fill="#1D428A" text-anchor="middle">
    আ
  </text>

  <!-- ==================== BOTTOM TEXT ==================== -->
  <!-- "Language School" curved along the bottom arc in bold italic serif font -->
  <text font-family="'Times New Roman', Georgia, serif" font-style="italic" font-weight="bold" font-size="38" fill="#18181B">
    <textPath href="#arc-school" startOffset="50%" text-anchor="middle">
      Language School
    </textPath>
  </text>
</svg>
